<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Tunely</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">Tunely</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Premium</a></li>
        <li><a href="signup.html">Support</a></li>
        <li><a href="signup.html">Download</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form class="form-box" action="index.html" method="get">
      <h1>Sign up for free</h1>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>

      <button type="submit" class="btn">Sign up</button>
    </form>
  </main>

  <footer class="footer">

    </ul>
  </footer>

</body>
</html>
